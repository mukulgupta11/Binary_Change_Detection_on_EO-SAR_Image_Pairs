# Configuration for Binary Change Detection

data:
  train_dir: "./train/train"
  val_dir: "./val/val"
  test_dir: "./test/test"

model:
  architecture: "unet"
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 4 # Will be updated dynamically if needed (e.g., EO=3, SAR=1)
  classes: 1

training:
  batch_size: 4
  epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  seed: 42
  save_dir: "./weights"

loss:
  name: "bce_dice"
  bce_weight: 0.5
  dice_weight: 0.5
  pos_weight: 5.0 # For BCE, to handle class imbalance
