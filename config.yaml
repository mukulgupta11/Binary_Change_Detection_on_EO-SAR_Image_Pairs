# ULTIMATE CONFIGURATION FOR GALAXEYE ASSIGNMENT

data:
  train_dir: "/tmp/data/train"
  val_dir: "/tmp/data/val"
  test_dir: "/tmp/data/test"

model:
  architecture: "unetplusplus"  # Upgraded from Unet to Unet++
  encoder_name: "resnet34"     # Faster backbone for the final 7-hour sprint
  encoder_weights: "imagenet"
  in_channels: 4 
  classes: 1

training:
  batch_size: 2                # Keep at 2 to avoid memory crashes
  epochs: 25                   # Safely fits within the 7.5 hour remaining quota
  learning_rate: 0.0001
  weight_decay: 0.01
  num_workers: 2               # Parallel data loading
  seed: 42
  save_dir: "./weights"

loss:
  name: "bce_dice"
  bce_weight: 0.4              # Slightly more weight on Dice for better boundaries
  dice_weight: 0.6
  pos_weight: 2.0              # Balanced sensitivity to stop yellow-blob hallucinations
